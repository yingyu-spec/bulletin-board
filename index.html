<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雲端智慧佈告欄 | 01~16 團隊出勤與行事曆</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- 主樣式表 (科技感・明亮・大字) -->
  <link rel="stylesheet" href="css/style.css?v=20260918_4">
</head>
<body>

  <!-- ==================== 頂部科技導覽列 ==================== -->
  <header class="app-header">
    <div class="container header-content">
      <!-- 系統標誌與名稱 -->
      <div class="brand">
        <div class="brand-icon">⚡</div>
        <div>
          <div class="brand-title">
            智慧雲端佈告欄
            <span class="brand-badge">CLOUD SYSTEM</span>
          </div>
        </div>
      </div>

      <!-- 使用者身分與 LINE 登入控制區 -->
      <div class="user-panel">
        <div class="current-user-badge" id="currentUserDisplay">
          <span>目前身分：</span>
          <span class="user-num-tag" id="currentUserIdTag">01 號</span>
        </div>

        <!-- 快速切換 01~16 測試模擬身分 -->
        <select id="userSwitcherSelect" class="user-switcher-select" title="快速切換操作人員號碼">
          <!-- 由 JavaScript 自動填充 01~16 -->
        </select>

        <!-- LINE 登入/登出按鈕 -->
        <button id="btnLineAuth" class="btn-line-login" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 5.82 2 10.53c0 3.01 1.83 5.67 4.62 7.15-.2.75-.72 2.73-.83 3.14-.13.51.18.5.38.37.15-.1 2.45-1.63 3.47-2.33.76.11 1.55.17 2.36.17 5.52 0 10-3.82 10-8.53S17.52 2 12 2z"/>
          </svg>
          <span id="lineAuthText">LINE 登入</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ==================== 主要操作與內容區域 ==================== -->
  <main class="container">
    <!-- 操作工具列：視圖切換 + 發布公告 -->
    <section class="controls-section">
      <!-- 視圖切換器 (條列式 vs 行事曆) -->
      <div class="view-tabs" role="tablist">
        <button type="button" class="view-tab-btn active" id="tabBtnList" role="tab" aria-selected="true">
          <span class="icon">📋</span>
          <span>條列式公告</span>
        </button>
        <button type="button" class="view-tab-btn" id="tabBtnCalendar" role="tab" aria-selected="false">
          <span class="icon">📅</span>
          <span>行事曆月曆</span>
        </button>
      </div>

      <!-- 發布按鈕 -->
      <div class="action-buttons">
        <button type="button" class="btn-create-post" id="btnOpenCreateModal">
          <span style="font-size: 1.4rem; line-height: 1;">+</span>
          <span>發布新公告</span>
        </button>
      </div>
    </section>

    <!-- 搜尋與篩選工具列 -->
    <section class="filter-bar">
      <!-- 內容搜尋 -->
      <div class="search-input-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" class="search-input" placeholder="搜尋公告內容、人員號碼..." autocomplete="off">
      </div>

      <!-- 人員號碼篩選 -->
      <div class="filter-group">
        <label for="attendeeFilterSelect" class="filter-label">出勤人員：</label>
        <select id="attendeeFilterSelect" class="filter-select">
          <option value="ALL">全部人員 (01~16)</option>
          <!-- 由 JS 自動填入 01~16 -->
        </select>
      </div>

      <!-- 資料同步按鈕 -->
      <button type="button" class="btn-card-action" id="btnRefreshData" title="從 Google Sheets 重新同步" style="padding: 10px 16px;">
        🔄 重新整理
      </button>
    </section>

    <!-- ==================== 視圖 1: 條列式公告檢視 ==================== -->
    <section id="listViewSection" class="list-view-container">
      <div id="announcementList">
        <!-- 由 list.js 動態渲染卡片清單 -->
      </div>
    </section>

    <!-- ==================== 視圖 2: 行事曆月曆檢視 ==================== -->
    <section id="calendarViewSection" class="calendar-view-container" style="display: none;">
      <!-- 行事曆控制器 -->
      <div class="calendar-header">
        <div class="calendar-month-title" id="calCurrentMonthTitle">
          2026 年 9 月
        </div>
        <div class="calendar-nav-buttons">
          <button type="button" class="btn-cal-nav" id="calBtnPrev" title="上個月">◀</button>
          <button type="button" class="btn-cal-today" id="calBtnToday">今天</button>
          <button type="button" class="btn-cal-nav" id="calBtnNext" title="下個月">▶</button>
        </div>
      </div>

      <!-- 星期標題 (日 ~ 六) -->
      <div class="calendar-weekdays-grid">
        <div class="weekday-header-cell weekend">星期日</div>
        <div class="weekday-header-cell">星期一</div>
        <div class="weekday-header-cell">星期二</div>
        <div class="weekday-header-cell">星期三</div>
        <div class="weekday-header-cell">星期四</div>
        <div class="weekday-header-cell">星期五</div>
        <div class="weekday-header-cell weekend">星期六</div>
      </div>

      <!-- 日期格子 -->
      <div class="calendar-days-grid" id="calendarDaysGrid">
        <!-- 由 calendar.js 動態渲染月曆天數 -->
      </div>
    </section>
  </main>

  <!-- ==================== 彈出視窗: 新增/編輯公告 ==================== -->
  <div class="modal-overlay" id="announcementModal">
    <div class="modal-container" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title" id="modalFormTitle">
          <span>📢</span>
          <span>發布新公告</span>
        </h2>
        <button type="button" class="modal-close-btn" id="btnCloseModal" aria-label="關閉">✕</button>
      </div>

      <form id="announcementForm">
        <input type="hidden" id="editAnnouncementId" value="">

        <div class="modal-body">
          <!-- 選擇日期 -->
          <div class="form-group">
            <label for="postDateInput" class="form-label">
              <span>📅 公告日期與時間</span>
              <span class="required-badge">* 必選</span>
            </label>
            <input type="datetime-local" id="postDateInput" class="form-input" required>
            <!-- 自動計算之星期預覽 -->
            <div id="postWeekdayDisplay" class="date-preview-badge">
              🗓️ 星期：<strong id="postWeekdayText">尚未選擇日期</strong>
            </div>
          </div>

          <!-- 公告內容 -->
          <div class="form-group">
            <label for="postContentInput" class="form-label">
              <span>📝 公告內容</span>
              <span class="required-badge">* 必填</span>
            </label>
            <textarea id="postContentInput" class="form-textarea" rows="4" placeholder="請輸入重要事項、出勤任務或公告說明..." required></textarea>
          </div>

          <!-- 01~16 出勤人員點選 -->
          <div class="form-group">
            <div class="form-label">
              <span>👥 出勤人員 (可複選 01~16 號)</span>
              <div class="attendees-selector-controls">
                <button type="button" class="btn-selector-tool" id="btnSelectAllAttendees">全選</button>
                <button type="button" class="btn-selector-tool" id="btnClearAllAttendees">清空</button>
              </div>
            </div>
            <!-- 01~16 大按鈕網格 -->
            <div class="attendees-grid-select" id="attendeesGrid">
              <!-- 由 JS 生成 01 ~ 16 切換按鈕 -->
            </div>
          </div>

          <!-- 發布人員 (自動抓取當前登入者) -->
          <div class="form-group">
            <label class="form-label">
              <span>👤 發布人員 (當前身分)</span>
            </label>
            <div style="font-size: 1.15rem; font-weight: 800; color: var(--cyber-blue); background: #f0f9ff; padding: 10px 16px; border-radius: var(--radius-md); border: 1.5px solid var(--border-tech); display: flex; align-items: center; justify-content: space-between;">
              <span id="postAuthorDisplay">01 號成員</span>
              <span style="font-size: 0.95rem; color: var(--text-muted);">自動標註發布時間</span>
            </div>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-modal-cancel" id="btnCancelModal">取消</button>
          <button type="submit" class="btn-modal-submit" id="btnSavePost">確認發布</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== 彈出視窗: 查看特定日期公告詳情 ==================== -->
  <div class="modal-overlay" id="dayDetailModal">
    <div class="modal-container" role="dialog" aria-modal="true" style="max-width: 760px;">
      <div class="modal-header">
        <h2 class="modal-title" id="dayDetailTitle">
          <span>📅</span>
          <span id="dayDetailDateText">2026-09-18 (五) 公告詳情</span>
        </h2>
        <button type="button" class="modal-close-btn" id="btnCloseDayDetailModal">✕</button>
      </div>
      <div class="modal-body" id="dayDetailBody" style="max-height: 60vh; overflow-y: auto;">
        <!-- 當日公告卡片將動態填入此處 -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-modal-cancel" id="btnCloseDayDetailBtn">關閉</button>
        <button type="button" class="btn-modal-submit" id="btnAddNewPostOnThisDay">+ 於此日發布公告</button>
      </div>
    </div>
  </div>

  <!-- ==================== 彈出視窗: 刪除確認視窗 (避免瀏覽器原生彈窗閃退) ==================== -->
  <div class="modal-overlay" id="confirmDeleteModal" style="z-index: 1050;">
    <div class="modal-container" role="dialog" aria-modal="true" style="max-width: 480px;">
      <div class="modal-header" style="background: #fff1f2; border-bottom: 1.5px solid #fecdd3;">
        <h2 class="modal-title" style="color: var(--cyber-rose);">
          <span>⚠️</span>
          <span>確認刪除公告</span>
        </h2>
        <button type="button" class="modal-close-btn" id="btnCloseConfirmDeleteModal">✕</button>
      </div>
      <div class="modal-body" style="padding: 24px; font-size: 1.15rem; line-height: 1.6;">
        <p style="font-weight: 800; color: var(--text-primary); margin-bottom: 10px;">確定要從雲端試算表中刪除此筆公告嗎？</p>
        <div id="confirmDeleteDetails" style="background: #f8fafc; border: 1.5px solid #e2e8f0; border-radius: var(--radius-md); padding: 14px; color: var(--text-secondary); font-size: 1rem; line-height: 1.5;">
          <!-- 動態填入公告資訊 -->
        </div>
      </div>
      <div class="modal-footer" style="background: #ffffff; border-top: 1.5px solid #f1f5f9;">
        <button type="button" class="btn-modal-cancel" id="btnCancelDelete">取消</button>
        <button type="button" class="btn-modal-submit" id="btnConfirmDeleteExec" style="background: linear-gradient(135deg, #e11d48, #f43f5e);">確認刪除</button>
      </div>
    </div>
  </div>

  <!-- ==================== 彈出視窗: LINE 帳號綁定號碼 ==================== -->
  <div class="modal-overlay" id="lineBindingModal" style="z-index: 1100;">
    <div class="modal-container" role="dialog" aria-modal="true" style="max-width: 520px;">
      <div class="modal-header" style="background: linear-gradient(135deg,#06c755,#00a040); border-bottom: none;">
        <h2 class="modal-title" style="color:#fff;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;"><path d="M12 2C6.48 2 2 5.82 2 10.53c0 3.01 1.83 5.67 4.62 7.15-.2.75-.72 2.73-.83 3.14-.13.51.18.5.38.37.15-.1 2.45-1.63 3.47-2.33.76.11 1.55.17 2.36.17 5.52 0 10-3.82 10-8.53S17.52 2 12 2z"/></svg>
          <span>LINE 帳號綁定</span>
        </h2>
      </div>
      <div class="modal-body" style="padding: 24px;">
        <p style="font-size:1.1rem; color:var(--text-secondary); margin-bottom:6px;">歡迎，<strong id="lineBindingDisplayName" style="color:#06c755;">LINE 使用者</strong>！</p>
        <p style="font-size:1.05rem; font-weight:700; color:var(--text-primary); margin-bottom:18px;">請選擇您的成員號碼完成綁定：</p>
        <!-- 01~16 號碼大按鈕網格 -->
        <div id="bindingMemberGrid" style="
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 10px;
          margin-bottom: 8px;
        ">
          <!-- 由 JS 動態填入 01~16 -->
        </div>
        <p style="font-size:0.9rem; color:var(--text-muted); margin-top:10px;">⚠️ 每個號碼僅能綁定一位成員，綁定後下次登入將自動識別。</p>
      </div>
      <div class="modal-footer" style="background:#f8fafc; border-top:1.5px solid #e2e8f0;">
        <button type="button" class="btn-modal-cancel" id="btnCancelBinding">稍後再說</button>
        <button type="button" class="btn-modal-submit" id="btnConfirmBinding" disabled
          style="background:linear-gradient(135deg,#06c755,#00a040);"
          onclick="LiffAuth.confirmBinding(this.dataset.selectedId)">
          確認綁定
        </button>
      </div>
    </div>
  </div>

  <!-- 全域 Toast 提示訊息 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ==================== 程式邏輯腳本 ==================== -->
  <script src="js/config.js?v=20260919_6"></script>
  <script src="js/data-store.js?v=20260919_6"></script>
  <script src="js/liff-auth.js?v=20260919_6"></script>
  <script src="js/list.js?v=20260919_6"></script>
  <script src="js/calendar.js?v=20260919_6"></script>
  <script src="js/app.js?v=20260919_6"></script>
</body>
</html>
